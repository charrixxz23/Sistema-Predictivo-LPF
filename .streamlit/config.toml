# Tema de Pronóstico LPF · base neutra de papel; el color lo ponen los clubes.
# Los tokens de color coinciden con app/ui/styles.py (única fuente del CSS adicional).

[theme]
base = "light"
primaryColor = "#00875A"
backgroundColor = "#FBF8F2"
secondaryBackgroundColor = "#F3EEE4"
textColor = "#17181A"
borderColor = "#C9C2B3"
baseRadius = "0.375rem"
font = "Barlow"
headingFont = "Barlow Condensed"

# Fuentes libres (OFL) guardadas en app/static/fonts: la app funciona sin internet.
[[theme.fontFaces]]
family = "Barlow"
url = "app/static/fonts/Barlow-400.woff2"
weight = 400

[[theme.fontFaces]]
family = "Barlow"
url = "app/static/fonts/Barlow-500.woff2"
weight = 500

[[theme.fontFaces]]
family = "Barlow"
url = "app/static/fonts/Barlow-600.woff2"
weight = 600

[[theme.fontFaces]]
family = "Barlow"
url = "app/static/fonts/Barlow-700.woff2"
weight = 700

[[theme.fontFaces]]
family = "Barlow Condensed"
url = "app/static/fonts/BarlowCondensed-600.woff2"
weight = 600

[[theme.fontFaces]]
family = "Barlow Condensed"
url = "app/static/fonts/BarlowCondensed-700.woff2"
weight = 700

[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
