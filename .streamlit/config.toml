# Tema de Pronóstico LPF · paleta «Claro y verde».
# Los tokens de color coinciden con app/ui/styles.py (única fuente del CSS adicional).

[theme]
base = "light"
primaryColor = "#00875A"
backgroundColor = "#F3F4F5"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#1F2328"
borderColor = "#DADDE1"
baseRadius = "0.5rem"
font = "Barlow"
headingFont = "Barlow Condensed"

# Fuentes libres (OFL) guardadas en app/static/fonts: la app funciona sin internet.
[[theme.fontFaces]]
family = "Barlow"
url = "app/static/fonts/Barlow-400.woff2"
weight = 400

[[theme.fontFaces]]
family = "Barlow"
url = "app/static/fonts/Barlow-500.woff2"
weight = 500

[[theme.fontFaces]]
family = "Barlow"
url = "app/static/fonts/Barlow-600.woff2"
weight = 600

[[theme.fontFaces]]
family = "Barlow"
url = "app/static/fonts/Barlow-700.woff2"
weight = 700

[[theme.fontFaces]]
family = "Barlow Condensed"
url = "app/static/fonts/BarlowCondensed-600.woff2"
weight = 600

[[theme.fontFaces]]
family = "Barlow Condensed"
url = "app/static/fonts/BarlowCondensed-700.woff2"
weight = 700

[server]
enableStaticServing = true

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
